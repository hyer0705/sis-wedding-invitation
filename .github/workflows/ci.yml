name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  # 유출 게이트. 로컬 pre-commit 훅은 --no-verify로 우회되므로 이 잡이 최종 방어선이다.
  # 이 리포는 프라이빗 + 무료 플랜이라 브랜치 보호·시크릿 스캐닝 푸시 차단을 못 쓴다.
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # develop...HEAD 비교와 커밋 메시지 검사에 전체 히스토리가 필요하다
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      - name: 시크릿·개인정보·금지 파일 검사
        run: npm run review:branch

      - name: 의존성 취약점 검사
        run: npm audit --audit-level=high --omit=dev

  check:
    runs-on: ubuntu-latest
    env:
      # D-Day 계산이 KST 기준이므로 러너 시간대를 고정한다
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        # npm ci를 쓰지 못하는 이유:
        # sharp의 wasm32 변형이 요구하는 @emnapi/runtime·core가 package-lock.json에
        # 최상위 엔트리로 기록되지 않아(macOS에서 설치 대상이 아니라 npm이 생략) npm ci가
        # 무결성 검사에서 중단된다. lock을 재생성하면 이번엔 리눅스 네이티브 바이너리가
        # 빠져 빌드가 깨지므로, 전 플랫폼 정보를 담은 현재 lock을 유지하고 install을 쓴다.
        run: npm install --no-audit --no-fund

      - name: 포맷·린트·타입·유닛테스트·빌드
        run: npm run check

      - name: Playwright 브라우저 설치
        # webkit은 iOS Safari(CM-09) 엔진 검증용이라 함께 설치한다
        run: npx playwright install --with-deps chromium webkit

      - name: E2E 테스트
        run: npm run test:e2e

      # playwright-report/ 는 html 리포터의 산출물인데, CI 는 github 리포터를 쓰므로
      # 그 폴더가 애초에 생기지 않는다. 실패할 때마다 「No files were found」만 남고
      # 트레이스는 한 번도 올라오지 않았다. 실제 산출물은 test-results/ 이고,
      # 그 안에 trace.zip(trace: on-first-retry)과 error-context.md 가 들어 있다.
      #
      # webkit 은 로컬 macOS 에서 Bus error 로 죽어(WORKFLOW.md) ios-safari 실패는
      # 여기서 받는 트레이스가 유일한 증거다.
      - name: 실패 시 트레이스 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
