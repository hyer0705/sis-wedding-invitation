<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>__OG_TITLE__</title>
    <meta name="description" content="__OG_DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__OG_TITLE__" />
    <meta property="og:description" content="__OG_DESCRIPTION__" />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:url" content="__SITE_URL__" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/parisienne-latin.woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Parisienne";
        font-style: normal;
        font-weight: 400;
        font-display: optional;
        src: url("/fonts/parisienne-latin.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC,
          U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        max-width: 430px;
        margin: 0 auto;
        background: #f5f3ea;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 54px;
      }
      .boot-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .boot-title {
        font-family: "Parisienne", cursive;
        font-size: 30px;
        line-height: 1;
        color: #667662;
      }
      .boot-track {
        display: block;
        margin-top: 20px;
        width: 1px;
        height: 44px;
        background: #e6e8dd;
      }
      .boot-track i {
        display: block;
        width: 100%;
        height: 100%;
        background: #667662;
        opacity: 0.75;
        transform-origin: top;
        animation: boot-fill 1.6s cubic-bezier(0.25, 0.6, 0.3, 1) infinite;
      }
      @keyframes boot-fill {
        0% {
          transform: scaleY(0);
        }
        72% {
          transform: scaleY(1);
          opacity: 0.75;
        }
        100% {
          transform: scaleY(1);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-track i {
          animation: none;
        }
      }
    </style>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div id="boot" role="status" aria-labelledby="boot-label">
      <span id="boot-label" class="boot-sr">청첩장을 불러오는 중</span>
      <span class="boot-title" aria-hidden="true">The wedding of</span>
      <span class="boot-track" aria-hidden="true"><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
