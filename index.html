<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      아래 __대문자__ 자리는 vite.config.ts 의 inviteMeta 플러그인이 빌드 시점에
      src/invite.ts 의 INVITE 값으로 채운다. 여기에 직접 적지 않는다 — 예전에
      직접 적어 둔 날짜가 INVITE 와 어긋난 채 배포된 적이 있다(SIS-24).
      카카오톡 스크래퍼는 절대 URL 만 읽으므로 og:image·og:url 이 절대 경로여야 한다.
    -->
    <title>__OG_TITLE__</title>
    <meta name="description" content="__OG_DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__OG_TITLE__" />
    <meta property="og:description" content="__OG_DESCRIPTION__" />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:url" content="__SITE_URL__" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Parisienne&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />
    <!--
      카카오톡 공유(SH-01)용 SDK. 이 스크립트가 window.Kakao 를 만든다.

      integrity 를 붙여 버전을 고정한다 — CDN 의 파일이 바뀌면 로드 자체가 막히고,
      src/lib/share.ts 가 navigator.share → 클립보드 순으로 degrade 한다. 버전을
      올릴 때는 해시도 함께 다시 계산해야 한다:
        curl -s <src> | openssl dgst -sha384 -binary | openssl base64 -A

      JS 키는 번들에 그대로 노출되므로 숨길 수단이 없다. 카카오 개발자 콘솔의
      플랫폼 도메인 화이트리스트가 유일한 방어선이다 — 배포·프리뷰 도메인을 등록한다.
    -->
    <script
      src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.6/kakao.min.js"
      integrity="sha384-WAtVcQYcmTO/N+C1N+1m6Gp8qxh+3NlnP7X1U7qP6P5dQY/MsRBNTh+e1ahJrkEm"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
