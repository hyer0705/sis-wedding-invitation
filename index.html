<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      아래 __대문자__ 자리는 vite.config.ts 의 inviteMeta 플러그인이 빌드 시점에
      src/invite.ts 의 INVITE 값으로 채운다. 여기에 직접 적지 않는다 — 예전에
      직접 적어 둔 날짜가 INVITE 와 어긋난 채 배포된 적이 있다(SIS-24).
      카카오톡 스크래퍼는 절대 URL 만 읽으므로 og:image·og:url 이 절대 경로여야 한다.
    -->
    <title>__OG_TITLE__</title>
    <meta name="description" content="__OG_DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__OG_TITLE__" />
    <meta property="og:description" content="__OG_DESCRIPTION__" />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:url" content="__SITE_URL__" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Parisienne&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />
    <!--
      카카오톡 공유(SH-01)용 SDK. 이 스크립트가 window.Kakao 를 만든다.

      integrity 를 붙여 버전을 고정한다 — CDN 의 파일이 바뀌면 로드 자체가 막히고,
      src/lib/share.ts 가 navigator.share → 클립보드 순으로 degrade 한다. 버전을
      올릴 때는 해시도 함께 다시 계산해야 한다:
        curl -s <src> | openssl dgst -sha384 -binary | openssl base64 -A

      JS 키는 번들에 그대로 노출되므로 숨길 수단이 없다. 카카오 개발자 콘솔의
      플랫폼 도메인 화이트리스트가 유일한 방어선이다 — 배포·프리뷰 도메인을 등록한다.
    -->
    <script
      src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.6/kakao.min.js"
      integrity="sha384-WAtVcQYcmTO/N+C1N+1m6Gp8qxh+3NlnP7X1U7qP6P5dQY/MsRBNTh+e1ahJrkEm"
      crossorigin="anonymous"
      defer
    ></script>
    <!--
      부트 화면(body 의 #boot)의 스타일. **반드시 head 에 둔다.**

      body 안에, 그것도 마크업 뒤에 두었더니 문제가 있었다 — 브라우저는 HTML 을 받는
      대로 파싱하며 그리는데, 5.6KB 짜리 이 파일은 3G 에서 여러 청크로 나뉘어 온다.
      #boot 만 담긴 청크가 먼저 그려지면 스타일 없는 날문자가 좌상단에 뜬다. 숨김
      규칙(.boot-sr)도 함께 늦어 스크린리더용 텍스트까지 화면에 나온다. 빈 화면을
      메우려던 것이 되레 깨진 화면을 보이는 순간을 만든다.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #f5f3ea;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 54px;
      }
      /* global.css 의 .sr-only 와 같은 구실. 그 파일도 4.1초에야 오므로 여기 다시 적는다. */
      .boot-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .boot-title {
        font-family: "Parisienne", cursive;
        font-size: 30px;
        line-height: 1;
        color: #7e9079;
      }
      .boot-track {
        display: block;
        margin-top: 20px;
        width: 1px;
        height: 44px;
        background: #e6e8dd;
      }
      .boot-track i {
        display: block;
        width: 100%;
        height: 100%;
        background: #7e9079;
        /* 키프레임에만 두면 안 된다. 아래 reduced-motion 에서 animation 을 끄는 순간
           기본값 1 로 돌아가, React 로딩 화면(0.75)으로 넘어갈 때 선이 갑자기 옅어진다. */
        opacity: 0.75;
        transform-origin: top;
        animation: boot-fill 1.6s cubic-bezier(0.25, 0.6, 0.3, 1) infinite;
      }
      @keyframes boot-fill {
        0% {
          transform: scaleY(0);
        }
        72% {
          transform: scaleY(1);
          opacity: 0.75;
        }
        100% {
          transform: scaleY(1);
          opacity: 0;
        }
      }
      /* MotionConfig 는 React 안에서만 도는 설정이라 여기까지 오지 않는다. 직접 끈다. */
      @media (prefers-reduced-motion: reduce) {
        .boot-track i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
      CM-04 부트 화면 — src/components/Loading.tsx 가 뜨기 전까지의 자리를 메운다.

      로딩 화면은 React 컴포넌트라 번들이 도착해 실행돼야 보인다. Slow 3G 에서 재 보면
      HTML 은 2.0초에 오는데 번들은 7.9초에 와서, 그 6초 동안 하객이 보는 것은 흰 화면
      이었다. 로딩 화면을 만든 목적이 정작 가장 오래 비어 있는 구간에 닿지 않았다.

      **색상·치수를 직접 적은 이유**: 토큰이 담긴 CSS 파일도 4.1초에야 온다. var(--bg) 를
      쓰면 그때까지 아무 색이 없다. head 의 값들은 tokens.css 의 --bg, --primary,
      --input-border 와 **같은 값이며 바꿀 때 함께 고쳐야 한다.** 자리 값(54/20/44)은
      Loading.tsx 와 맞춰 두 화면이 이어질 때 글씨가 움직이지 않게 한 것이다.

      진행선이 여기서만 반복하는 것도 일부러다. 이 구간은 얼마나 걸릴지 알 수 없어
      한 번 차고 멈추면 정지 화면이 된다. Loading.tsx 는 기다림의 끝이 보이므로 1회다.

      **스타일은 head 에 있다.** 여기 두면 HTML 이 나뉘어 올 때 스타일 없는 날문자가
      먼저 그려진다 — head 쪽 주석 참고.

      aria-labelledby 로 아래 텍스트를 이름으로도 삼는다. status 는 내용으로 이름이
      만들어지는 role 이 아니라, 이것이 없으면 이름 없는 알림 영역이 된다
      (Loading.tsx 가 같은 이유로 같은 방식을 쓴다).
    -->
    <div id="boot" role="status" aria-labelledby="boot-label">
      <span id="boot-label" class="boot-sr">청첩장을 불러오는 중</span>
      <span class="boot-title" aria-hidden="true">The wedding of</span>
      <span class="boot-track" aria-hidden="true"><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
